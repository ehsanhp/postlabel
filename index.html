<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>چاپ لیبل پستی</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#64748b;--ln:#d5dce3;--pr:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#1a242c;--tx:#e6edf3;--mut:#93a4b3;--ln:#2e3d49;--pr:#2dd4bf}}
:root[data-theme="dark"]{--bg:#10171d;--card:#1a242c;--tx:#e6edf3;--mut:#93a4b3;--ln:#2e3d49;--pr:#2dd4bf}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:560px;margin:0 auto;padding:12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}label.ck input{width:auto}
input,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;font:inherit;font-size:16px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px}
.btn{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:700;font-size:16px}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.row{display:flex;gap:8px}.row>*{flex:1}
.pv{overflow:hidden;border:1px solid var(--ln);border-radius:8px;background:#fff;position:relative}
.pvi{transform-origin:top right;position:absolute;top:0;right:0}
.hi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.hi:last-child{border:0}.hi div{flex:1;min-width:0}.hi small{color:var(--mut);display:block}
.hi button{padding:7px 10px;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:8px;font:inherit;font-size:13px}
.hide{display:none}
.lb{--nv:#26307a;width:148mm;height:100mm;padding:4mm;background:#fff;color:#000;display:flex;gap:4mm;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;overflow:hidden}
.col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.R{--lh:7mm}.L{--lh:6.3mm}
.lg{height:30mm;flex:none;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:3mm;text-align:center;font-weight:800;color:var(--nv);font-size:9pt}
.lg img{max-height:24mm;max-width:31mm;min-width:0;object-fit:contain}
#hq{margin-bottom:8px}
.dv{flex:none;border-top:.4mm dotted #f08a24;margin:1mm 0 2mm}
.r{flex:none;display:flex;align-items:flex-end;gap:1.5mm;height:var(--lh)}
.k{white-space:nowrap;color:var(--nv);line-height:1.2;padding-bottom:.6mm}
.k b{font-weight:800}.en{direction:ltr}
.v{flex:1;min-width:0;border-bottom:.25mm solid var(--nv);line-height:1.2;padding:0 1mm .5mm;overflow:hidden;white-space:nowrap}
.ad{flex:none;line-height:var(--lh);min-height:calc(var(--lh)*4);padding:0 1mm;white-space:pre-line;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - .25mm),var(--nv) calc(var(--lh) - .25mm),var(--nv) var(--lh))}
.pill{width:34mm;height:calc(var(--lh) - 1mm);align-self:center;border:.3mm solid var(--nv);border-radius:4mm;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.7mm}
.bxl{flex:1;min-height:12mm;margin-top:2mm;border:.35mm solid #d6336c;border-radius:2.5mm;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:9pt}
#pa{display:none}
@page{size:148mm 100mm;margin:0}
@media print{body>*:not(#pa){display:none!important}#pa{display:block}body{background:#fff;padding:0}}
</style>
</head>
<body>
<div id="app">
<nav><button data-t="p" class="on">چاپ</button><button data-t="h">تاریخچه</button><button data-t="s">تنظیمات</button></nav>

<section id="p">
<div class="card">
<label style="margin-top:0">گیرنده</label><input id="n" autocomplete="off">
<label>شماره تماس</label><input id="ph" inputmode="tel" autocomplete="off">
<label>کدپستی</label><input id="pc" inputmode="numeric" maxlength="10" autocomplete="off">
<label>آدرس (با استان و شهر)</label><textarea id="ad"></textarea>
<div class="row"><button class="btn sec" id="clr">پاک کردن</button><button class="btn" id="prt">چاپ لیبل</button></div>
</div>
<div class="card"><label style="margin-top:0">پیش‌نمایش (۱۴۸×۱۰۰ میلی‌متر، افقی)</label><div class="pv" id="pv"><div class="pvi" id="pvi"></div></div></div>
</section>

<section id="h" class="hide"><div class="card"><input id="hq" type="search" placeholder="جستجو بر اساس نام، تلفن یا آدرس" autocomplete="off"><div id="hl"></div></div></section>

<section id="s" class="hide">
<div class="card">
<label style="margin-top:0">نام فرستنده / فروشگاه</label><input id="sn">
<label>شماره تماس</label><input id="sp" inputmode="tel">
<label>کدپستی</label><input id="sc" inputmode="numeric" maxlength="10">
<label>آدرس (با استان و شهر)</label><textarea id="sa"></textarea>
<label>لوگوی شما (کنار لوگوی پست چاپ می‌شود)</label><input type="file" id="lg" accept="image/*">
<label class="ck"><input type="checkbox" id="sb"> نمایش کادر «محل نصب لیبل»</label>
<div class="row"><button class="btn sec" id="lr">حذف لوگو</button><button class="btn" id="sv">ذخیره</button></div>
</div>
</section>
</div>
<div id="pa"></div>

<script>
const $=i=>document.getElementById(i);
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('ذخیره‌سازی مرورگر پر یا غیرفعال است')}};
const P='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>P[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>P.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S=()=>Object.assign({n:'',p:'',c:'',a:'',o:'',ct:'',logo:'',box:true},get('sender',{}));
const code=c=>fa(en(c||'').replace(/\D/g,'').slice(0,10));
function blk(x,w){
  const [t,e]=w;
  return `<div class="r"><span class="k"><b>${t} :</b> نام</span><span class="v">${esc(x.n)}</span><span class="k en">${e} :</span></div>
  <div class="ad">${esc(x.a)}</div>
  <div class="r"><span class="k">تلفن :</span><span class="v">${fa(esc(x.p))}</span></div>
  <div class="r"><span class="k">کد پستی :</span><span class="pill">${code(x.c)}</span></div>`;
}
function label(r){
  const s=S();
  const logo='<img src="img/post-logo.jpg">'+(s.logo?`<img src="${s.logo}">`:(s.n?`<span>${esc(s.n)}</span>`:''));
  return `<div class="lb"><div class="col R" data-fs="10"><div class="lg">${logo}</div><div class="dv"></div>${blk(r,['گیرنده','TO'])}</div>
  <div class="col L" data-fs="8.5">${blk(s,['فرستنده','FROM'])}${s.box?'<div class="bxl">محل نصب لیبل</div>':'<div style="flex:1"></div>'}</div></div>`;
}
const over=c=>c.scrollHeight>c.clientHeight+1||[...c.querySelectorAll('.v')].some(v=>v.scrollWidth>v.clientWidth+1);
function autofit(root){root.querySelectorAll('.col').forEach(c=>{let f=+c.dataset.fs;c.style.fontSize=f+'pt';while(over(c)&&f>5.5){f-=.25;c.style.fontSize=f+'pt'}})}
const cur=()=>({n:$('n').value.trim(),p:$('ph').value.trim(),c:$('pc').value.trim(),a:$('ad').value.trim()});
function fit(){const w=$('pv').clientWidth,k=w/(148*96/25.4);$('pvi').style.transform='scale('+k+')';$('pv').style.height=(100*96/25.4*k)+'px'}
function render(){$('pvi').innerHTML=label(cur());autofit($('pvi'));fit()}
['n','ph','pc','ad'].forEach(i=>$(i).addEventListener('input',render));
addEventListener('resize',fit);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){['p','h','s'].forEach(x=>$(x).classList.toggle('hide',x!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='p')render();if(t==='h')hist()}
$('clr').onclick=()=>{['n','ph','pc','ad'].forEach(i=>$(i).value='');render()};
$('prt').onclick=()=>{const r=cur();if(!r.n&&!r.a){alert('نام یا آدرس گیرنده را وارد کنید');return}
  const h=get('hist',[]);h.unshift({...r,t:Date.now()});set('hist',h.slice(0,200));
  render();$('pa').innerHTML=$('pvi').innerHTML;Promise.all([...$('pa').querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0)).then(()=>setTimeout(()=>window.print(),80))};
function hist(){const h=get('hist',[]),q=en($('hq').value).toLowerCase().split(/\s+/).filter(Boolean);
  const L=h.map((r,i)=>[r,i]).filter(([r])=>{const t=en([r.n,r.p,r.a].join(' ')).toLowerCase();return q.every(w=>t.includes(w))});
  $('hl').innerHTML=L.length?'':'<small style="color:var(--mut)">'+(h.length?'موردی پیدا نشد.':'هنوز لیبلی چاپ نشده است.')+'</small>';
  L.forEach(([r,i])=>{const d=document.createElement('div');d.className='hi';
    d.innerHTML=`<div><b>${esc(r.n||'—')}</b><small>${fa(esc(r.p||'—'))} · ${new Date(r.t).toLocaleDateString('fa-IR')}</small></div><button>چاپ مجدد</button><button>حذف</button>`;
    const [a,b]=d.querySelectorAll('button');
    a.onclick=()=>{$('n').value=r.n;$('ph').value=r.p;$('pc').value=r.c;$('ad').value=r.a;show('p')};
    b.onclick=()=>{if(!confirm('حذف شود؟'))return;h.splice(i,1);set('hist',h);hist()};
    $('hl').appendChild(d)})}
$('hq').addEventListener('input',hist);
function loadS(){const s=S();$('sn').value=s.n;$('sp').value=s.p;$('sc').value=s.c;$('sa').value=s.a;$('sb').checked=s.box}
$('sv').onclick=()=>{set('sender',{...S(),n:$('sn').value.trim(),p:$('sp').value.trim(),c:$('sc').value.trim(),a:$('sa').value.trim(),box:$('sb').checked});alert('ذخیره شد');show('p')};
$('lr').onclick=()=>{set('sender',{...S(),logo:''});$('lg').value='';alert('لوگو حذف شد')};
$('lg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{
  const m=400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  set('sender',{...S(),logo:c.toDataURL('image/jpeg',.88)});alert('لوگو ذخیره شد')};im.src=URL.createObjectURL(f)};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
loadS();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
if(!S().n&&!S().a)setTimeout(()=>{if(confirm('ابتدا اطلاعات فرستنده و لوگو را در تنظیمات وارد کنید؟'))show('s')},300);
</script>
</body>
</html>
